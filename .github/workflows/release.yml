name: Release

# Tylko tagi vX.Y.Z — sekrety nigdy nie są dostępne dla PR-ów z forków.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Ustal wersję z tagu
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sprawdź zgodność wersji z Info.plist
        run: |
          PLIST_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$PLIST_VER" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::Tag ${{ steps.ver.outputs.version }} != Info.plist $PLIST_VER"
            exit 1
          fi

      - name: Testy
        run: swift test

      # Certyfikat ląduje w tymczasowym keychainie, kasowanym po zadaniu.
      - name: Import certyfikatu Developer ID
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          # Bez tego codesign zawiesza się na promptcie o dostęp do klucza
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 \
            | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::Nie znaleziono tożsamości Developer ID w keychainie"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Narzędzia Sparkle
        run: |
          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Profil notarytool
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials zte-menu-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"

      - name: Build, notaryzacja, appcast
        env:
          # Klucz prywatny EdDSA czytany przez generate_appcast ze zmiennej
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/ZteMenu-${{ steps.ver.outputs.version }}.zip" \
            --title "ZTE Menu ${{ steps.ver.outputs.version }}" \
            --generate-notes

      - name: Publikacja appcastu na gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/ghp" gh-pages
          cp dist/appcast/appcast.xml "$RUNNER_TEMP/ghp/appcast.xml"
          git -C "$RUNNER_TEMP/ghp" add appcast.xml
          if git -C "$RUNNER_TEMP/ghp" diff --cached --quiet; then
            echo "Appcast bez zmian"
          else
            git -C "$RUNNER_TEMP/ghp" commit \
              -m "chore: appcast dla ${{ steps.ver.outputs.version }}"
            git -C "$RUNNER_TEMP/ghp" push origin gh-pages
          fi

      - name: Aktualizacja caska w tapie
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          SHA="$(shasum -a 256 "dist/ZteMenu-$VERSION.zip" | awk '{print $1}')"
          git clone "https://x-access-token:$GH_TOKEN@github.com/RadnoK/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' "s|^  version .*|  version \"$VERSION\"|" Casks/zte-menu.rb
          sed -i '' "s|^  sha256 .*|  sha256 \"$SHA\"|" Casks/zte-menu.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zte-menu.rb
          git commit -m "chore: zte-menu $VERSION"
          git push origin main

      - name: Sprzątanie keychaina
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
