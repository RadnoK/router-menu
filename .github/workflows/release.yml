name: Release

# Tags vX.Y.Z only — secrets are never available to PRs from forks.
on:
  push:
    tags:
      # Includes pre-releases (v0.7.0-beta.1), which ship on Sparkle's beta
      # channel and are only offered to users who opted in.
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

jobs:
  release:
    # macOS 26, not just its SDK: the app targets 26.0, and a test bundle
    # built for 26.0 cannot be dlopen'd on a macos-15 runner — SwiftUI 26
    # symbols are simply absent. That is what failed the v1.0.0 run.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Determine version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A hyphen marks a pre-release (0.7.0-beta.1) — the same rule the
          # app and release.sh use to pick the Sparkle channel.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # project.yml is the version source now: Resources/Info.plist is
      # GENERATED by xcodegen and holds "$(MARKETING_VERSION)", not a number.
      - name: Check version matches project.yml
        run: |
          YML_VER="$(grep -E '^\s+MARKETING_VERSION:' project.yml \
            | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "$YML_VER" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::Tag ${{ steps.ver.outputs.version }} != project.yml $YML_VER"
            exit 1
          fi

      # The SDK the app is built against decides which AppKit behaviour it
      # gets at runtime, and that is not cosmetic here: built against the
      # macOS 15 SDK (what macos-14 runners carry), clearing the panel
      # window's background makes `MenuBarExtra` draw nothing at all on
      # macOS 26 — a blank popover, while the very same commit built against
      # SDK 27 renders fully. Measured in the sibling project deploybar as
      # pixel variance over one commit's builds: 39 = content, 3 = blank, and
      # only the SDK differed. So the SDK is asserted, not assumed.
      - name: Select latest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          OS="$(sw_vers -productVersion)"
          echo "macOS SDK: $SDK   runner OS: $OS"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $SDK is too old — the popover ships blank on macOS 26. Need SDK 26+."
            exit 1
          fi
          # The SDK alone is not enough. A macos-15 runner carries SDK 26.2 and
          # passes the check above, but the app targets macOS 26 and its test
          # bundle cannot load there: `dlopen` fails on a missing SwiftUI 26
          # symbol, "built for macOS 26.0 which is newer than running OS".
          if [ "${OS%%.*}" -lt 26 ]; then
            echo "::error::Runner OS $OS is older than the macOS 26 deployment target — tests cannot load. Need a macos-26 runner."
            exit 1
          fi

      - name: xcodegen
        run: brew install xcodegen

      - name: Tests
        run: swift test

      # The certificate lands in a temporary keychain, deleted after the job.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          # Without this, codesign hangs on a key-access prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 \
            | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::Developer ID identity not found in the keychain"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sparkle tools
        run: |
          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: notarytool profile
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials zte-menu-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"

      - name: Build, notarization, appcast
        env:
          # EdDSA private key read by generate_appcast from the environment
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # release.sh re-downloads published archives so the generated feed
          # keeps its history; without a token `gh` refuses to run here and
          # the appcast silently ends up listing only the new version.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      # Idempotent — on a re-run the release already exists
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: dist/RouterMenu-${{ steps.ver.outputs.version }}.zip
          PRERELEASE: ${{ steps.ver.outputs.prerelease == 'true' && '1' || '' }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists — replacing the artifact"
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "Router Menu ${{ steps.ver.outputs.version }}" \
              ${PRERELEASE:+--prerelease} \
              --generate-notes
          fi

      - name: Publish appcast to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/ghp" gh-pages
          cp dist/appcast/appcast.xml "$RUNNER_TEMP/ghp/appcast.xml"
          git -C "$RUNNER_TEMP/ghp" add appcast.xml
          if git -C "$RUNNER_TEMP/ghp" diff --cached --quiet; then
            echo "Appcast unchanged"
          else
            git -C "$RUNNER_TEMP/ghp" commit \
              -m "chore: appcast for ${{ steps.ver.outputs.version }}"
            git -C "$RUNNER_TEMP/ghp" push origin gh-pages
          fi

      - name: Update cask in the tap
        if: steps.ver.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          SHA="$(shasum -a 256 "dist/RouterMenu-$VERSION.zip" | awk '{print $1}')"
          git clone "https://x-access-token:$GH_TOKEN@github.com/RadnoK/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' "s|^  version .*|  version \"$VERSION\"|" Casks/router-menu.rb
          sed -i '' "s|^  sha256 .*|  sha256 \"$SHA\"|" Casks/router-menu.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/router-menu.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date — nothing to do"
          else
            git commit -m "chore: router-menu $VERSION"
            git push origin main
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
